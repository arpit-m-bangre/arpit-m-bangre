<svg xmlns='http://www.w3.org/2000/svg' style='isolation: isolate' viewBox='0 0 495 212' width='495px' height='212px' direction='ltr'>
  <style>
    @keyframes currstreak {
      0% { font-size: 3px; opacity: 0.2; }
      80% { font-size: 33px; opacity: 1; }
      100% { font-size: 28px; opacity: 1; }
    }
    @keyframes fadein {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
  <defs>
    <clipPath id='outer_rectangle'>
      <rect width='495' height='212' rx='6' />
    </clipPath>
    <mask id='mask_out_ring_behind_fire'>
      <rect width='495' height='212' fill='white' />
      <ellipse id='mask-ellipse' cx='247.5' cy='31' rx='13' ry='17' fill='black' />
    </mask>
  </defs>

  <g clip-path='url(#outer_rectangle)'>
    <!-- Card Background -->
    <rect fill='#141321' x='0' y='0' width='495' height='212' />
    <!-- Top Accent Line -->
    <rect x='0' y='0' width='495' height='3' fill='#FE428E' opacity='0.9' />

    <!-- Column Dividers -->
    <line x1='165' y1='26' x2='165' y2='166' stroke='#A9FEF7' stroke-width='1' opacity='0.65' />
    <line x1='330' y1='26' x2='330' y2='166' stroke='#A9FEF7' stroke-width='1' opacity='0.65' />

    <!-- LEFT COLUMN: Total Contributions -->
    <g transform='translate(82.5, 46)'>
      <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='700' font-size='28px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.4s'>1,239</text>
    </g>
    <g transform='translate(82.5, 83)'>
      <text x='0' y='32' text-anchor='middle' fill='#A9FEF7' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='600' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.5s'>Total Contributions</text>
    </g>
    <g transform='translate(82.5, 113)'>
      <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='400' font-size='11.5px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>Jan 27, 2024 - Present</text>
    </g>

    <!-- CENTER COLUMN: Current Streak -->
    <g transform='translate(247.5, 46)'>
      <text x='0' y='32' text-anchor='middle' fill='#F8D847' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='700' font-size='28px' style='animation: currstreak 0.6s linear forwards'>102</text>
    </g>
    <g transform='translate(247.5, 106)'>
      <text x='0' y='32' text-anchor='middle' fill='#A9FEF7' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='700' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>Current Streak</text>
    </g>
    <g transform='translate(247.5, 134)'>
      <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='400' font-size='11.5px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>Aug 5 - Nov 14</text>
    </g>

    <!-- Flame Ring -->
    <g mask='url(#mask_out_ring_behind_fire)'>
      <circle cx='247.5' cy='70' r='40' fill='none' stroke='#F8D847' stroke-width='5' style='opacity: 0; animation: fadein 0.5s linear forwards 0.3s' />
    </g>
    <!-- Flame Icon -->
    <g transform='translate(247.5, 19)' style='opacity: 0; animation: fadein 0.5s linear forwards 0.4s'>
      <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none' />
      <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#FE428E' />
    </g>

    <!-- RIGHT COLUMN: Longest Streak -->
    <g transform='translate(412.5, 46)'>
      <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='700' font-size='28px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>102</text>
    </g>
    <g transform='translate(412.5, 83)'>
      <text x='0' y='32' text-anchor='middle' fill='#A9FEF7' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='600' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 1.0s'>Longest Streak</text>
    </g>
    <g transform='translate(412.5, 113)'>
      <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='"Segoe UI", Ubuntu, -apple-system, sans-serif' font-weight='400' font-size='11.5px' style='opacity: 0; animation: fadein 0.5s linear forwards 1.1s'>Aug 5 - Nov 14</text>
    </g>

    <!-- LIVE DYNAMIC MONITOR FOOTER -->
    <rect x='0' y='182' width='495' height='30' fill='#0F0E1A' />
    <line x1='0' y1='182' x2='495' y2='182' stroke='#2E2B4F' stroke-width='1' />
    <circle cx='30' cy='197' r='3.5' fill='#38BDF8' style='animation: pulse 2s ease-in-out infinite' />
    <text x='253' y='200.5' text-anchor='middle' fill='#A9FEF7' font-family='"Consolas", "Fira Code", monospace' font-weight='600' font-size='9.2px' letter-spacing='0.3'>LIVE MONITOR ACTIVE  •  TODAY: +2 COMMITS  •  SYNCED 14 NOV 2026, 19:22 IST</text>
  </g>
  <!-- Crisp Rounded Outer Border -->
  <rect stroke='#2E2B4F' stroke-width='1.2' fill='none' rx='6' x='0.6' y='0.6' width='493.8' height='210.8' />
</svg>
